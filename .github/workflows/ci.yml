name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: plugin

      - name: Check out hermes-agent (the host the plugin runs in)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          # hermes-agent declares its dependencies for Python 3.14 only.
          python-version: "3.14"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # hermes-agent resolves its dependencies with uv and relies on
      # [tool.uv] override-dependencies (e.g. Pillow 13 over browser-harness's
      # exact pillow==12.3.0 pin). Plain pip ignores those overrides and fails
      # with ResolutionImpossible, so install with uv and pass hermes-agent's
      # own override list, read from its pyproject.toml so it stays in sync.
      - name: Install hermes-agent
        run: |
          python -m pip install uv
          python - > "$RUNNER_TEMP/hermes-overrides.txt" <<'EOF'
          import tomllib
          with open("hermes-agent/pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print("\n".join(data.get("tool", {}).get("uv", {}).get("override-dependencies", [])))
          EOF
          cat "$RUNNER_TEMP/hermes-overrides.txt"
          uv pip install --system --override "$RUNNER_TEMP/hermes-overrides.txt" -e ./hermes-agent

      - name: Validate the plugin (same gate as the catalog CI)
        run: |
          mkdir -p "$RUNNER_TEMP/profiles/ci"
          HERMES_HOME="$RUNNER_TEMP/profiles/ci" hermes plugins validate --install-deps plugin

      - name: Backend tests
        working-directory: plugin
        run: python -m unittest discover -s tests -v

      - name: Desktop tests
        working-directory: plugin
        run: node --test "tests/frontend/*.test.mjs"

      - name: SDK imports exist
        working-directory: plugin
        run: node tests/check_sdk_exports.mjs ../hermes-agent
