name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: plugin

      - name: Check out hermes-agent (the host the plugin runs in)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install hermes-agent
        run: pip install -e ./hermes-agent

      - name: Validate the plugin (same gate as the catalog CI)
        run: |
          mkdir -p "$RUNNER_TEMP/profiles/ci"
          HERMES_HOME="$RUNNER_TEMP/profiles/ci" hermes plugins validate --install-deps plugin

      - name: Backend tests
        working-directory: plugin
        run: python -m unittest discover -s tests -v

      - name: Desktop tests
        working-directory: plugin
        run: node --test "tests/frontend/*.test.mjs"

      - name: SDK imports exist
        working-directory: plugin
        run: node tests/check_sdk_exports.mjs ../hermes-agent
